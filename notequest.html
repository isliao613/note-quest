<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="NoteQuest 音符探險 — 給小朋友和大人的鋼琴教學 App">
<meta name="theme-color" content="#0f172a">
<!-- 這是打包後的單檔版本，原始碼在 js/ 與 css/ 底下 -->
<title>NoteQuest 音符探險 · 鋼琴教室</title>
<style>
/* ==========================================================================
   NoteQuest — 樣式
   兩套主題：kid（明亮活潑）與 adult（沉穩深色），透過 body[data-theme] 切換
   ========================================================================== */

:root {
  --font: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", -apple-system,
          BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --dock-h: 190px;
  --dock-real: 190px;   /* 由 setDock() 依實際高度覆寫 */
  --tab-real: 0px;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 10px 30px rgba(0, 0, 0, .12);
  --ok: #22c55e;
  --bad: #ef4444;
  --warn: #f59e0b;
}

/* 小朋友：暖色、明亮、圓潤 */
body[data-theme="kid"] {
  --bg: #fff7ed;
  --bg-grad: radial-gradient(1200px 600px at 15% -10%, #fde68a55, transparent 60%),
             radial-gradient(900px 500px at 90% 0%, #a7f3d055, transparent 60%);
  --panel: #ffffff;
  --panel-2: #fffbf5;
  --border: #f3e3cd;
  --text: #3b2f2a;
  --text-dim: #8b7d74;
  --accent: #f97316;
  --accent-2: #ec4899;
  --accent-soft: #ffedd5;
  --key-white: #ffffff;
  --key-white-edge: #e3d7c9;
  --key-black: #3a2f2a;
  --key-text: #a08a78;
  --title-size: 1.45rem;
}

/* 大人：深色、低彩度、精緻 */
body[data-theme="adult"] {
  --bg: #0f172a;
  --bg-grad: radial-gradient(1000px 500px at 80% -10%, #1e293b, transparent 65%),
             radial-gradient(800px 400px at 0% 10%, #172554aa, transparent 60%);
  --panel: #1e293b;
  --panel-2: #172033;
  --border: #2f3d54;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --accent: #38bdf8;
  --accent-2: #a78bfa;
  --accent-soft: #1e3a5f;
  --key-white: #f1f5f9;
  --key-white-edge: #a8b3c4;
  --key-black: #0b1220;
  --key-text: #64748b;
  --title-size: 1.25rem;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* hidden 屬性必須贏過任何 display 宣告 */
[hidden] { display: none !important; }

html, body {
  margin: 0; padding: 0; height: 100%;
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  overscroll-behavior: none;
}
body {
  background-image: var(--bg-grad);
  background-attachment: fixed;
  display: flex; flex-direction: column;
  transition: background-color .35s ease, color .35s ease;
}

button { font-family: inherit; color: inherit; cursor: pointer; }
h1, h2, h3 { margin: 0; }
small { font-size: .78rem; }

/* ---------- 開場畫面 ---------- */
.boot {
  position: fixed; inset: 0; z-index: 100;
  display: grid; place-items: center;
  background: var(--bg); background-image: var(--bg-grad);
}
.boot.hide { opacity: 0; pointer-events: none; transition: opacity .45s ease; }
.boot-card { text-align: center; padding: 32px; max-width: 420px; }
.boot-logo { font-size: 68px; animation: bob 2.6s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg);} 50% { transform: translateY(-10px) rotate(4deg);} }
.boot-card h1 { font-size: 2.1rem; letter-spacing: -.02em; margin: 8px 0 2px; }
.boot-card h1 span { display: block; font-size: 1rem; font-weight: 600; color: var(--text-dim); letter-spacing: .3em; margin-top: 6px; }
.boot-sub { color: var(--text-dim); margin: 14px 0 26px; }
.boot-tip { color: var(--text-dim); font-size: .76rem; margin-top: 20px; line-height: 1.6; }

/* ---------- 頂列 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 7px; font-weight: 800; letter-spacing: -.01em; }
.brand-mark { font-size: 1.2rem; }
.brand-name { font-size: .98rem; }
body[data-theme="kid"] .brand-name { color: var(--accent); }
.topbar-stats { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.stat { display: flex; align-items: center; gap: 6px; font-size: .82rem; }
.stat-icon { font-size: .95rem; }
.stat-body { display: flex; flex-direction: column; gap: 3px; }
.xpbar { display: block; width: 62px; height: 5px; border-radius: 99px; background: var(--border); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 99px; transition: width .5s ease; }
.icon-btn {
  width: 36px; height: 36px; flex: none; border: 1px solid var(--border);
  background: var(--panel); border-radius: 11px; font-size: 1rem;
  display: grid; place-items: center; transition: transform .12s ease, background .2s;
}
.icon-btn:active { transform: scale(.92); }

/* ---------- 畫面容器 ---------- */
#screens { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 92px; }
#screens.docked { padding-bottom: calc(var(--dock-h) + 20px); }
.screen { display: none; padding: 16px 14px 8px; max-width: 900px; margin: 0 auto; }
.screen.active { display: block; animation: fadeUp .32s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: none; } }
.screen-title { font-size: var(--title-size); font-weight: 800; margin-bottom: 14px; letter-spacing: -.01em; }

/* ---------- 通用元件 ---------- */
.btn {
  border: 1px solid var(--border); background: var(--panel);
  border-radius: 12px; padding: 10px 16px; font-size: .88rem; font-weight: 700;
  transition: transform .12s ease, filter .2s, background .2s;
}
.btn:active { transform: scale(.96); }
.btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: #fff; box-shadow: 0 8px 20px -8px var(--accent); }
.btn-lg { padding: 15px 34px; font-size: 1.05rem; border-radius: 15px; }
.btn-ghost { background: transparent; }
.btn.on { background: var(--accent); border-color: transparent; color: #fff; }
.btn:disabled { opacity: .42; pointer-events: none; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.pill { display: inline-block; padding: 3px 9px; border-radius: 99px; font-size: .7rem; font-weight: 700; background: var(--accent-soft); color: var(--accent); }
body[data-theme="adult"] .pill { color: var(--text); }
.muted { color: var(--text-dim); }

/* ---------- 首頁 ---------- */
.mode-switch { display: flex; gap: 8px; background: var(--panel-2); border: 1px solid var(--border); padding: 5px; border-radius: 15px; margin-bottom: 16px; }
.mode-btn { flex: 1; border: none; background: transparent; padding: 11px; border-radius: 11px; font-weight: 700; font-size: .9rem; transition: all .25s; }
.mode-btn.active { background: var(--panel); box-shadow: var(--shadow); color: var(--accent); }
body[data-theme="adult"] .mode-btn.active { background: var(--accent); color: #06131f; }

.continue-card {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; border-radius: var(--radius); padding: 18px; margin-bottom: 16px;
  box-shadow: 0 14px 34px -14px var(--accent);
}
.continue-card h3 { font-size: 1.15rem; margin-bottom: 4px; }
.continue-card p { margin: 0 0 14px; opacity: .9; font-size: .84rem; }
.continue-card .btn { background: rgba(255,255,255,.95); color: #1a1a1a; border: none; }
.continue-card .cc-eyebrow { font-size: .74rem; letter-spacing: .04em; opacity: .88; margin-bottom: 2px; }

.tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 11px; }
.tile {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 17px 14px; text-align: left; display: flex; flex-direction: column; gap: 3px;
  transition: transform .16s ease, box-shadow .2s;
}
.tile:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.tile:active { transform: scale(.97); }
.tile-icon { font-size: 1.7rem; margin-bottom: 4px; }
.tile b { font-size: .96rem; }
.tile small { color: var(--text-dim); }

/* ---------- 單元 / 課程 ---------- */
.unit-list { display: flex; flex-direction: column; gap: 14px; }
.unit { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.unit-head { display: flex; align-items: center; gap: 12px; padding: 15px 16px; }
.unit-icon { font-size: 1.6rem; width: 44px; height: 44px; display: grid; place-items: center; background: var(--accent-soft); border-radius: 13px; flex: none; }
.unit-head h3 { font-size: 1rem; }
.unit-head p { margin: 2px 0 0; font-size: .78rem; color: var(--text-dim); }
.unit-prog { margin-left: auto; font-size: .74rem; color: var(--text-dim); white-space: nowrap; }
.lesson-row {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 13px 16px; background: transparent; border: none; border-top: 1px solid var(--border);
  text-align: left; transition: background .2s;
}
.lesson-row:hover { background: var(--panel-2); }
.lesson-row.locked { opacity: .42; pointer-events: none; }
.lesson-badge { width: 32px; height: 32px; flex: none; border-radius: 10px; display: grid; place-items: center; font-size: .9rem; background: var(--panel-2); border: 1px solid var(--border); }
.lesson-row.done .lesson-badge { background: var(--ok); border-color: transparent; color: #fff; }
.lesson-row b { font-size: .89rem; display: block; }
.lesson-row small { color: var(--text-dim); }
.stars { margin-left: auto; font-size: .8rem; letter-spacing: 1px; white-space: nowrap; }

/* ---------- 曲目 ---------- */
.filter-row { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 14px; }
.song-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 11px; }
.song-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px; text-align: left; transition: transform .16s, box-shadow .2s; }
.song-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.song-card h3 { font-size: 1rem; }
.song-card .sub { font-size: .76rem; color: var(--text-dim); margin: 2px 0 9px; }
.song-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 9px; }
.song-tags span { font-size: .68rem; padding: 2px 8px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim); }
.level-dots { display: inline-flex; gap: 3px; vertical-align: middle; }
.level-dots i { width: 6px; height: 6px; border-radius: 99px; background: var(--border); }
.level-dots i.on { background: var(--accent); }

/* ---------- 演奏畫面 ---------- */
.screen-play { max-width: 1100px; }
.play-head { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.play-title h2 { font-size: 1.15rem; }
.play-title span { font-size: .78rem; color: var(--text-dim); }
.play-hud { margin-left: auto; display: flex; gap: 16px; }
.hud-item { text-align: right; }
.hud-item small { display: block; color: var(--text-dim); font-size: .68rem; }
.hud-item b { font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.play-progress { height: 5px; background: var(--border); border-radius: 99px; margin: 12px 0; overflow: hidden; }
.play-progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .1s linear; }
.play-prompt { text-align: center; padding: 10px 0 4px; min-height: 62px; }
.play-prompt .big { font-size: 2rem; font-weight: 800; letter-spacing: -.02em; }
.play-prompt .sub { color: var(--text-dim); font-size: .84rem; margin-top: 4px; }
.play-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center; margin: 4px 0 10px; }
.ctl-group { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 6px 10px; font-size: .78rem; }
.ctl-group input[type="range"] { width: 92px; accent-color: var(--accent); }
.staff-panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 4px; overflow-x: auto; margin: 8px 0; }

/* 五線譜 SVG */
.staff-wrap { overflow-x: auto; }
.staff { display: block; height: auto; max-width: none; }
.staff-line { stroke: var(--text-dim); stroke-width: 1; opacity: .8; }
.staff-line.brace { stroke-width: 2.4; opacity: 1; }
.clef { fill: none; stroke: var(--text); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.clef-dot { fill: var(--text); }
.acc-stroke { fill: none; stroke: var(--text); stroke-width: 1.9; stroke-linecap: round; }
.notehead { fill: var(--text); }
.notehead.hollow { fill: var(--panel); stroke: var(--text); stroke-width: 2; }
.stem, .ledger { stroke: var(--text); stroke-width: 1.7; stroke-linecap: round; }
.flag { fill: none; stroke: var(--text); stroke-width: 2.3; stroke-linecap: round; }
.note-lyric { font-size: 11px; fill: var(--text-dim); font-family: var(--font); }
.note-group { transition: opacity .2s; }
.note-group.nt-current .notehead { fill: var(--accent); }
.note-group.nt-current .stem, .note-group.nt-current .flag { stroke: var(--accent); }
.note-group.nt-good .notehead { fill: var(--ok); }
.note-group.nt-bad .notehead { fill: var(--bad); }

/* ---------- 鍵盤底座 ---------- */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--panel);
  border-top: 1px solid var(--border);
  padding: 0 6px max(6px, env(safe-area-inset-bottom));
  box-shadow: 0 -12px 34px -20px rgba(0,0,0,.5);
  touch-action: none;
}
.dock.with-fall { padding-top: 0; }
.fall-canvas { display: block; width: 100%; height: 0; }
.dock.with-fall .fall-canvas { height: clamp(170px, 30vh, 300px); }
.dock-hint { text-align: center; font-size: .74rem; color: var(--text-dim); padding: 5px 0 3px; min-height: 22px; }

/* 琴鍵 */
.keyboard { position: relative; height: 150px; user-select: none; touch-action: none; }
.kb-whites, .kb-blacks { position: absolute; inset: 0; }
.kb-blacks { pointer-events: none; }
.key { position: absolute; top: 0; }
.key.white {
  height: 100%; background: var(--key-white);
  border: 1px solid var(--key-white-edge); border-top: none;
  border-radius: 0 0 7px 7px;
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 9px;
  transition: background .06s;
}
.key.black {
  height: 62%; background: var(--key-black); pointer-events: auto;
  border-radius: 0 0 5px 5px; z-index: 2;
  box-shadow: 0 3px 6px rgba(0,0,0,.35);
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px;
}
.key-label { font-size: .64rem; font-weight: 700; color: var(--key-text); pointer-events: none; }
.key.black .key-label { color: #cbd5e1; font-size: .5rem; letter-spacing: -.02em; }
.middle-c-dot { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); width: 6px; height: 6px; border-radius: 99px; background: var(--accent); pointer-events: none; }
.key-badge {
  position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%);
  min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px;
  background: var(--accent); color: #fff; font-size: .6rem; font-weight: 800;
  display: grid; place-items: center; pointer-events: none;
}

.key.white.pressed { background: color-mix(in srgb, var(--accent) 26%, var(--key-white)); }
.key.black.pressed { background: color-mix(in srgb, var(--accent) 55%, var(--key-black)); }

/* 彩虹鍵（小朋友模式） */
.keyboard.colorful .key.white { background: color-mix(in srgb, var(--note-color) 16%, #fff); }
.keyboard.colorful .key.white .key-label { color: color-mix(in srgb, var(--note-color) 75%, #3b2f2a); }
.keyboard.colorful .key.white.pressed { background: color-mix(in srgb, var(--note-color) 60%, #fff); }
.keyboard.colorful .key.black { background: color-mix(in srgb, var(--note-color) 22%, #241d1a); }
.keyboard.colorful .key.black.pressed { background: var(--note-color); }

/* 教學提示 */
.key.mk-hint   { box-shadow: inset 0 -34px 26px -26px var(--accent), 0 0 0 2px var(--accent) inset; }
.key.mk-target { animation: pulseKey 1.05s ease-in-out infinite; }
.key.white.mk-target { background: color-mix(in srgb, var(--accent) 34%, var(--key-white)); }
.key.black.mk-target { background: color-mix(in srgb, var(--accent) 64%, var(--key-black)); }
.key.white.mk-good { background: color-mix(in srgb, var(--ok) 40%, #fff); }
.key.black.mk-good { background: var(--ok); }
.key.white.mk-bad  { background: color-mix(in srgb, var(--bad) 38%, #fff); }
.key.black.mk-bad  { background: var(--bad); }
.key.white.mk-scale { background: color-mix(in srgb, var(--accent-2) 30%, var(--key-white)); }
.key.black.mk-scale { background: color-mix(in srgb, var(--accent-2) 58%, var(--key-black)); }
@keyframes pulseKey { 0%,100% { filter: brightness(1);} 50% { filter: brightness(1.28);} }

/* ---------- 底部分頁 ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 35;
  display: flex; background: color-mix(in srgb, var(--panel) 94%, transparent);
  backdrop-filter: blur(14px); border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar.hidden { display: none; }
.tabbar button {
  flex: 1; border: none; background: none; padding: 9px 0 7px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: .66rem; color: var(--text-dim); font-weight: 700;
}
.tabbar button span { font-size: 1.12rem; }
.tabbar button.active { color: var(--accent); }

/* ---------- 自由彈奏 / 樂理 ---------- */
.free-panel { display: flex; flex-direction: column; gap: 12px; }
.chord-readout { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; text-align: center; }
.chord-readout b { display: block; font-size: 1.9rem; letter-spacing: -.02em; min-height: 42px; }
.chord-readout small { color: var(--text-dim); }
.control-row { display: flex; gap: 8px; flex-wrap: wrap; }
.theory-body, .ear-body { display: flex; flex-direction: column; gap: 13px; }
.select-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
select, input[type="text"] {
  font-family: inherit; font-size: .85rem; padding: 9px 11px; border-radius: 11px;
  border: 1px solid var(--border); background: var(--panel); color: var(--text);
}
.degree-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.degree-grid button { padding: 11px 4px; border-radius: 11px; border: 1px solid var(--border); background: var(--panel); font-weight: 700; font-size: .82rem; }
.degree-grid button small { display: block; color: var(--text-dim); font-weight: 500; font-size: .62rem; }

/* ---------- 聽力 / 測驗 ---------- */
.quiz-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; text-align: center; }
.quiz-q { font-size: 1.08rem; font-weight: 700; margin-bottom: 16px; line-height: 1.5; }
.quiz-options { display: grid; gap: 9px; }
.quiz-options button { padding: 14px; border-radius: 13px; border: 1px solid var(--border); background: var(--panel-2); font-size: .92rem; font-weight: 600; text-align: left; transition: all .18s; }
.quiz-options button:hover { border-color: var(--accent); }
.quiz-options button.correct { background: var(--ok); color: #fff; border-color: transparent; }
.quiz-options button.wrong { background: var(--bad); color: #fff; border-color: transparent; }
.quiz-explain { margin-top: 14px; padding: 13px; border-radius: 12px; background: var(--accent-soft); font-size: .84rem; line-height: 1.65; text-align: left; }
body[data-theme="adult"] .quiz-explain { background: var(--panel-2); border: 1px solid var(--border); }
.quiz-progress { display: flex; gap: 4px; justify-content: center; margin-bottom: 14px; }
.quiz-progress i { width: 20px; height: 4px; border-radius: 99px; background: var(--border); }
.quiz-progress i.ok { background: var(--ok); }
.quiz-progress i.no { background: var(--bad); }

/* ---------- 覆蓋層 / 結算 ---------- */
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(10,12,20,.62); backdrop-filter: blur(7px); display: grid; place-items: center; padding: 20px; }
.result-card { background: var(--panel); border-radius: 24px; padding: 30px 26px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,.4); animation: pop .4s cubic-bezier(.2,1.3,.4,1); }
@keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
.result-stars { font-size: 2.7rem; letter-spacing: 6px; margin: 6px 0 12px; }
.result-stars i { display: inline-block; font-style: normal; animation: starIn .5s backwards cubic-bezier(.2,1.4,.4,1); }
.result-stars i:nth-child(2) { animation-delay: .16s; }
.result-stars i:nth-child(3) { animation-delay: .32s; }
@keyframes starIn { from { transform: scale(0) rotate(-90deg); opacity: 0; } }
.result-card h3 { font-size: 1.35rem; margin-bottom: 6px; }
.result-metrics { display: flex; justify-content: center; gap: 22px; margin: 16px 0 20px; }
.result-metrics div small { display: block; color: var(--text-dim); font-size: .7rem; }
.result-metrics div b { font-size: 1.2rem; }
.result-actions { display: flex; gap: 9px; }
.result-actions .btn { flex: 1; }

/* ---------- 提示訊息 ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--dock-h) + 24px); transform: translateX(-50%);
  z-index: 70; background: var(--panel); border: 1px solid var(--border);
  padding: 11px 18px; border-radius: 13px; font-size: .85rem; font-weight: 600;
  box-shadow: var(--shadow); animation: toastIn .3s ease;
}
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } }

/* ---------- 成果 ---------- */
.sticker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 10px; }
.sticker { aspect-ratio: 1; display: grid; place-items: center; font-size: 1.9rem; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; }
.sticker.locked { filter: grayscale(1); opacity: .28; }
.stat-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-bottom: 18px; }
.stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; text-align: center; }
.stat-card b { display: block; font-size: 1.6rem; letter-spacing: -.02em; }
.stat-card small { color: var(--text-dim); }

/* ---------- 設定 ---------- */
.setting-row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); }
.setting-row:last-child { border-bottom: none; }
.setting-row .label { flex: 1; }
.setting-row .label b { display: block; font-size: .9rem; }
.setting-row .label small { color: var(--text-dim); }
.switch { width: 46px; height: 27px; border-radius: 99px; background: var(--border); position: relative; border: none; flex: none; transition: background .25s; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 99px; background: #fff; transition: transform .25s; box-shadow: 0 2px 5px rgba(0,0,0,.25); }
.switch.on { background: var(--accent); }
.switch.on::after { transform: translateX(19px); }

@media (min-width: 760px) {
  .keyboard { height: 176px; }
  .dock.with-fall .fall-canvas { height: clamp(200px, 34vh, 340px); }
  :root { --dock-h: 230px; }
}
@media (max-width: 400px) {
  .keyboard { height: 132px; }
  .dock.with-fall .fall-canvas { height: clamp(150px, 26vh, 220px); }
  :root { --dock-h: 168px; }
}

<body data-theme="kid">

<div id="boot" class="boot">
  <div class="boot-card">
    <div class="boot-logo">🎹</div>
    <h1>NoteQuest<span>音符探險</span></h1>
    <p class="boot-sub">給小朋友和大人的鋼琴教室</p>
    <button id="boot-start" class="btn btn-primary btn-lg">開始彈琴</button>
    <p class="boot-tip">點一下才能開啟聲音 · 支援滑鼠、觸控、電腦鍵盤與 MIDI 電鋼琴</p>
  </div>
</div>

<header class="topbar">
  <button class="icon-btn" id="btn-back" hidden aria-label="返回">←</button>
  <div class="brand"><span class="brand-mark">🎹</span><span class="brand-name">NoteQuest</span></div>
  <div class="topbar-stats">
    <div class="stat" title="等級與經驗值">
      <span class="stat-icon">⭐</span>
      <span class="stat-body">
        <b id="stat-level">Lv.1</b>
        <span class="xpbar"><i id="xp-fill"></i></span>
      </span>

  </div>
  <button class="icon-btn" id="btn-settings" aria-label="設定">⚙️</button>
</header>

<main id="screens">

  <!-- 首頁 -->
  <section class="screen active" id="screen-home">
    <div class="mode-switch" role="tablist">
      <button class="mode-btn" data-mode="kid" role="tab">🧒 小朋友模式</button>
      <button class="mode-btn" data-mode="adult" role="tab">🎓 大人模式</button>
    </div>

    <div class="continue-card" id="continue-card"></div>

    <div class="tile-grid">
      <button class="tile" data-go="lessons"><span class="tile-icon">📚</span><b>課程</b><small>一步一步學</small></button>
      <button class="tile" data-go="songs"><span class="tile-icon">🎵</span><b>練習曲</b><small>彈完整的歌</small></button>
      <button class="tile" data-go="free"><span class="tile-icon">🎹</span><b>自由彈奏</b><small>隨便亂彈也很棒</small></button>
      <button class="tile" data-go="ear"><span class="tile-icon">👂</span><b>聽力訓練</b><small>練出好耳朵</small></button>
      <button class="tile" data-go="theory"><span class="tile-icon">🔬</span><b>音階和弦</b><small>看看音樂的骨架</small></button>
      <button class="tile" data-go="stats"><span class="tile-icon">🏅</span><b>我的成果</b><small>星星與貼紙</small></button>
    </div>
  </section>

  <!-- 課程列表 -->
  <section class="screen" id="screen-lessons">
    <h2 class="screen-title">課程</h2>
    <div id="unit-list" class="unit-list"></div>
  </section>

  <!-- 曲目列表 -->
  <section class="screen" id="screen-songs">
    <h2 class="screen-title">練習曲</h2>
    <div class="filter-row" id="song-filter"></div>
    <div id="song-list" class="song-list"></div>
  </section>

  <!-- 演奏 / 課程進行中 -->
  <section class="screen screen-play" id="screen-play">
    <div class="play-head">
      <div class="play-title"><h2 id="play-title">—</h2><span id="play-sub"></span></div>
      <div class="play-hud">
        <div class="hud-item"><small>準確度</small><b id="hud-acc">—</b></div>
        <div class="hud-item"><small>連擊</small><b id="hud-combo">0</b></div>
        <div class="hud-item"><small>分數</small><b id="hud-score">0</b></div>
      </div>
    </div>
    <div class="play-progress"><i id="play-progress-fill"></i></div>
    <div class="play-controls" id="play-controls"></div>
    <div id="play-staff" class="staff-panel" hidden></div>
    <div id="play-prompt" class="play-prompt"></div>
  </section>

  <!-- 自由彈奏 -->
  <section class="screen" id="screen-free">
    <h2 class="screen-title">自由彈奏</h2>
    <div class="free-panel">
      <div class="chord-readout" id="chord-readout"><b>—</b><small>彈幾個音看看，我會告訴你這是什麼和弦</small></div>
      <div class="control-row" id="free-controls"></div>
      <div id="free-staff" class="staff-panel"></div>
    </div>
  </section>

  <!-- 聽力訓練 -->
  <section class="screen" id="screen-ear">
    <h2 class="screen-title">聽力訓練</h2>
    <div id="ear-body" class="ear-body"></div>
  </section>

  <!-- 音階和弦實驗室 -->
  <section class="screen" id="screen-theory">
    <h2 class="screen-title">音階與和弦</h2>
    <div id="theory-body" class="theory-body"></div>
  </section>

  <!-- 成果 -->
  <section class="screen" id="screen-stats">
    <h2 class="screen-title">我的成果</h2>
    <div id="stats-body"></div>
  </section>

  <!-- 設定 -->
  <section class="screen" id="screen-settings">
    <h2 class="screen-title">設定</h2>
    <div id="settings-body"></div>
  </section>

</main>

<!-- 鍵盤底座（所有畫面共用同一台鋼琴） -->
<div id="dock" class="dock" hidden>
