name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，但不中斷進行中的那個
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      # 一次性設定：Settings -> Pages -> Source 選「GitHub Actions」
      #
      # 這裡刻意不加 enablement: true。建立 Pages 站台的 API 需要 repo admin
      # 權限，而 workflow 的 GITHUB_TOKEN 拿不到，只會失敗在
      #   Create Pages site failed. Error: Resource not accessible by integration
      # 站台開好之後，這一步就只是讀取設定，不需要額外權限。
      - name: 設定 Pages
        uses: actions/configure-pages@v5

      - name: 整理要發佈的檔案
        run: |
          mkdir -p _site
          cp index.html notequest.html manifest.webmanifest _site/
          cp -r css js assets _site/
          # 讓 Jekyll 不要處理這些檔案
          touch _site/.nojekyll
          ls -R _site | head -40

      - name: 上傳網站內容
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
