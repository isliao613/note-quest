name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，但不中斷進行中的那個
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Pages
        uses: actions/configure-pages@v5
        with:
          # 若 repo 還沒開啟 Pages，這裡會自動幫忙開
          enablement: true

      - name: 整理要發佈的檔案
        run: |
          mkdir -p _site
          cp index.html notequest.html _site/
          cp -r css js _site/
          # 讓 Jekyll 不要處理這些檔案
          touch _site/.nojekyll
          ls -R _site | head -40

      - name: 上傳網站內容
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
